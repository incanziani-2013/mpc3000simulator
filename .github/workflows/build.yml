
name: Build VST3

on: [push, pull_request, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target MPC3000_SIMULATOR_VST3 --parallel 2

      - name: Verify VST3
        shell: pwsh
        run: |
          $path = "build/MPC3000_SIMULATOR_artefacts/Release/VST3"
          if (!(Test-Path $path)) {
            throw "VST3 folder not found"
          }

          $plugin = Get-ChildItem $path -Filter "*.vst3"
          if (!$plugin) {
            throw "VST3 plugin not generated"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MPC3000_SIMULATOR_WINDOWS_VST3
          path: build/MPC3000_SIMULATOR_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
